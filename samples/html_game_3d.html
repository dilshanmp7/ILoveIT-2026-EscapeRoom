        /* ========================================================================
           1. AUDIO SOUND EFFECTS SYNTHESIZER
           ======================================================================== */
        class SoundFX {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { }
            }
            play(effect) {
                this.init();
                if (effect === 'type') {
                    this.playTone(800, 'square', 0.05, 0.05);
                    setTimeout(() => this.playTone(850, 'square', 0.05, 0.05), 50);
                }
                else if (effect === 'process') {
                    this.playTone(150, 'sawtooth', 0.1, 0.08);
                    setTimeout(() => this.playTone(200, 'sawtooth', 0.1, 0.08), 100);
                }
                else if (effect === 'pickup') this.playTone(600, 'sine', 0.1, 0.15);
                else if (effect === 'drop') this.playTone(300, 'triangle', 0.1, 0.15);
                else if (effect === 'unlock') {
                    this.playTone(800, 'sine', 0.1, 0.1);
                    setTimeout(() => this.playTone(1200, 'sine', 0.15, 0.15), 100);
                }
                else if (effect === 'deliver') {
                    this.playTone(523.25, 'sine', 0.1, 0.2);
                    setTimeout(() => this.playTone(659.25, 'sine', 0.1, 0.2), 100);
                    setTimeout(() => this.playTone(783.99, 'sine', 0.2, 0.2), 200);
                }
                else if (effect === 'riddle_success') {
                    this.playTone(440, 'triangle', 0.1, 0.2);
                    setTimeout(() => this.playTone(880, 'sine', 0.25, 0.2), 120);
                }
                else if (effect === 'dash') this.playTone(200, 'sawtooth', 0.1, 0.12);
            }
        }
        const sfx = new SoundFX();
        function playSound(type) { sfx.play(type); }

        /* ========================================================================
           2. PHYSICS ENGINE & TECH ITEMS
           ======================================================================== */
        class PhysicalBody {
            constructor(params) {
                this.x = params.x || 0; this.y = params.y || 0; this.z = params.z || 0;
                this.width = params.width || 1; this.depth = params.depth || 1;
                this.isStatic = params.isStatic || false; this.mesh = params.mesh || null;
            }
            getAABB() {
                return { minX: this.x - this.width / 2, maxX: this.x + this.width / 2, minZ: this.z - this.depth / 2, maxZ: this.z + this.depth / 2 };
            }
        }

        class KitchenPhysicsWorld {
            constructor() { this.bodies = []; }
            addBody(body) { this.bodies.push(body); return body; }
            checkAABBCollision(a, b) {
                const boxA = a.getAABB(); const boxB = b.getAABB();
                return (boxA.minX < boxB.maxX && boxA.maxX > boxB.minX && boxA.minZ < boxB.maxZ && boxA.maxZ > boxB.minZ);
            }
            moveBodyWithSlide(body, deltaX, deltaZ) {
                if (body.isStatic) return;
                body.x += deltaX;
                for (let other of this.bodies) {
                    if (other !== body && this.checkAABBCollision(body, other)) {
                        if (deltaX > 0) body.x = other.x - other.width / 2 - body.width / 2 - 0.001;
                        else if (deltaX < 0) body.x = other.x + other.width / 2 + body.width / 2 + 0.001;
                    }
                }
                body.z += deltaZ;
                for (let other of this.bodies) {
                    if (other !== body && this.checkAABBCollision(body, other)) {
                        if (deltaZ > 0) body.z = other.z - other.depth / 2 - body.depth / 2 - 0.001;
                        else if (deltaZ < 0) body.z = other.z + other.depth / 2 + body.depth / 2 + 0.001;
                    }
                }
                if (body.mesh) { body.mesh.position.x = body.x; body.mesh.position.z = body.z; }
            }
        }
        let physicsWorld = new KitchenPhysicsWorld();

        class TechItem {
            constructor(type) {
                this.type = type; // 'laptop' or 'server'
                this.isConfigured = false;
                this.mesh = this.createMesh();
            }
            createMesh() {
                const group = new THREE.Group();
                if (this.type === 'laptop') {
                    const mat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.8 });
                    const base = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.3), mat);
                    group.add(base);

                    if (this.isConfigured) {
                        const screenMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
                        const screen = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.02), screenMat);
                        screen.position.set(0, 0.15, -0.14);
                        screen.rotation.x = -Math.PI / 12;
                        group.add(screen);

                        const displayMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
                        const display = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.25), displayMat);
                        display.position.set(0, 0.15, -0.125);
                        display.rotation.x = -Math.PI / 12;
                        group.add(display);
                    } else {
                        const lid = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.3), mat);
                        lid.position.y = 0.04;
                        group.add(lid);
                    }
                } else if (this.type === 'server') {
                    const mat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5 });
                    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.5), mat);
                    group.add(blade);

                    const lightMat = new THREE.MeshBasicMaterial({ color: this.isConfigured ? 0x22c55e : 0xef4444 });
                    const light = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.02), lightMat);
                    light.position.set(-0.1, 0, 0.26);
                    group.add(light);
                }
                return group;
            }
        }

        let scene, camera, renderer;
        let player, playerPhysicsBody;
        let kitchenCounters = [];
        let occludableMeshes = [];
        let occlusionRaycaster = new THREE.Raycaster();
        let cameraOffset = new THREE.Vector3(0, 8.5, 8.8);
        let currentCameraLookAt = new THREE.Vector3(0, 0.8, 1);

        function init3DScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 15, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const floorMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.8 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 16), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(20, 20, 0x94a3b8, 0xcbd5e1);
            grid.position.y = 0.01;
            scene.add(grid);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        /* Animated Courier Avatar Mesh with limbs and walk cycle capability */

        let playerWalkCycle = 0;
        function updatePlayerAnimation(isMoving, isHolding) {
            if (!player) return;
            const lLeg = player.getObjectByName("leftLeg");
            const rLeg = player.getObjectByName("rightLeg");
            const lArm = player.getObjectByName("leftArm");
            const rArm = player.getObjectByName("rightArm");

            if (isMoving) {
                playerWalkCycle += 0.25;
                const swing = Math.sin(playerWalkCycle) * 0.55;
                if (lLeg) lLeg.rotation.x = swing;
                if (rLeg) rLeg.rotation.x = -swing;
                if (!isHolding) {
                    if (lArm) lArm.rotation.x = -swing * 0.7;
                    if (rArm) rArm.rotation.x = swing * 0.7;
                }
            } else {
                playerWalkCycle = 0;
                if (lLeg) lLeg.rotation.x = THREE.MathUtils.lerp(lLeg.rotation.x, 0, 0.2);
                if (rLeg) rLeg.rotation.x = THREE.MathUtils.lerp(rLeg.rotation.x, 0, 0.2);
            }

            if (isHolding) {
                if (lArm) {
                    lArm.rotation.x = THREE.MathUtils.lerp(lArm.rotation.x, -Math.PI / 2.2, 0.2);
                    lArm.rotation.z = THREE.MathUtils.lerp(lArm.rotation.z, 0.15, 0.2);
                }
                if (rArm) {
                    rArm.rotation.x = THREE.MathUtils.lerp(rArm.rotation.x, -Math.PI / 2.2, 0.2);
                    rArm.rotation.z = THREE.MathUtils.lerp(rArm.rotation.z, -0.15, 0.2);
                }
            } else if (!isMoving) {
                if (lArm) {
                    lArm.rotation.x = THREE.MathUtils.lerp(lArm.rotation.x, 0, 0.2);
                    lArm.rotation.z = THREE.MathUtils.lerp(lArm.rotation.z, 0, 0.2);
                }
                if (rArm) {
                    rArm.rotation.x = THREE.MathUtils.lerp(rArm.rotation.x, 0, 0.2);
                    rArm.rotation.z = THREE.MathUtils.lerp(rArm.rotation.z, 0, 0.2);
                }
            }
        }

                const rotRad = THREE.MathUtils.degToRad(item.rotation || 0);

                });

                if (item.type !== 'wall') {
                    kitchenCounters.push({
                        id: item.id,
                        mesh: mesh,
                        x: item.x,
                        z: item.z,
                        type: item.type,
                        label: item.label,
                        rotation: item.rotation || 0,
                        keyId: item.keyId,

                        heldItem: null,

                        x: item.x,
                        y: 0,
                        z: item.z,
                        width: item.w,
                        height: 2.0,
                        depth: item.d,

                    }));

        function triggerGrabDrop() {
            debugger;

            const btnGrab = document.getElementById('btn-grab');
            if (btnGrab.disabled) return;
            if (heldItem) {
                if (currentNearbyCounter && !currentNearbyCounter.heldItem) {
                    const accepts = currentNearbyCounter.acceptsDrop || '';
                    const itemType = heldItem.type;
                    let canDrop = true;
                    if (accepts && accepts !== 'any') {
                        if (accepts === 'configured') {
                            canDrop = (heldItem instanceof TechItem && heldItem.isConfigured);
                        } else {
                            canDrop = (accepts === itemType);
                        }
                    }

                    if (canDrop) {
                        player.getObjectByName('holdingSlot').remove(heldItem.mesh);
                        currentNearbyCounter.heldItem = heldItem;
                        currentNearbyCounter.mesh.add(heldItem.mesh);
                        heldItem.mesh.position.set(0, 1.3, 0);
                        heldItem = null;
                        playSound('drop');
                        updateButtonStates();
                        return;
                    }
                }

                const dropDist = 1.2;
                const dropX = Math.round((player.position.x + Math.sin(player.rotation.y) * dropDist) * 2) / 2;
                const dropZ = Math.round((player.position.z + Math.cos(player.rotation.y) * dropDist) * 2) / 2;

                let itemTypeStr = 'box_laptop';
                let labelStr = 'Dropped Laptop';
                let keyIdStr = undefined;
                let colorVal = 0x334155;

                if (heldItem instanceof TechItem) {
                    itemTypeStr = heldItem.type === 'server' ? 'box_server' : 'box_laptop';
                    labelStr = heldItem.type === 'server' ? 'Server Box' : 'Laptop Box';
                } else if (heldItem.type === 'key') {
                    itemTypeStr = 'key';
                    labelStr = heldItem.label || 'ID Badge';
                    keyIdStr = heldItem.keyId;
                    colorVal = 0x0ea5e9;
                }

                const newObj = {
                    id: 'dropped_' + Date.now(),
                    x: dropX, z: dropZ, w: 1.2, d: 1.2, rotation: 0,
                    color: colorVal, type: itemTypeStr, label: labelStr,
                    allowGrab: true, actionType: 'none', keyId: keyIdStr
                };

                assetRepository.mapLayout.push(newObj);
                player.getObjectByName('holdingSlot').remove(heldItem.mesh);
                heldItem = null;
                playSound('drop');
                applyEditorChangesToKitchen();
                updateButtonStates();
                return;
            }

            if (!currentNearbyCounter) return;
            const counter = currentNearbyCounter;

            if (counter.allowGrab) {
                if (counter.type === 'key') {
                    heldItem = { type: 'key', keyId: counter.keyId, label: counter.label, mesh: new THREE.Group() };
                    const badge = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.02), new THREE.MeshStandardMaterial({ color: 0x0ea5e9 }));
                    badge.position.set(0, 0, 0);
                    heldItem.mesh.add(badge);
                    player.getObjectByName('holdingSlot').add(heldItem.mesh);
                    heldItem.mesh.position.set(0, 0, 0);
                    playSound('pickup');

                    const idx = assetRepository.mapLayout.findIndex(o => o.id === counter.id);
                    if (idx !== -1) assetRepository.mapLayout.splice(idx, 1);
                    applyEditorChangesToKitchen();
                } else if (counter.type === 'box_laptop' || counter.type === 'box_server') {
                    heldItem = new TechItem(counter.type === 'box_server' ? 'server' : 'laptop');
                    player.getObjectByName('holdingSlot').add(heldItem.mesh);
                    heldItem.mesh.position.set(0, 0, 0);
                    playSound('pickup');
                }
            } else if (counter.actionType === 'trash' && heldItem) {
                player.getObjectByName('holdingSlot').remove(heldItem.mesh);
                heldItem = null;
                playSound('drop');
            } else if (counter.heldItem && !heldItem) {
                heldItem = counter.heldItem;
                counter.heldItem = null;
                counter.mesh.remove(heldItem.mesh);
                player.getObjectByName('holdingSlot').add(heldItem.mesh);
                heldItem.mesh.position.set(0, 0, 0);
                playSound('pickup');
            }
            updateButtonStates();
        }

        function triggerAction() {
            const btnAction = document.getElementById('btn-action');
            if (btnAction.disabled) return;
            if (!currentNearbyCounter) return;
            const counter = currentNearbyCounter;

            if (counter.useAction === 'open_door' || counter.type === 'door') {
                const reqKey = counter.requiredKeyIds || (counter.requiredKeyIds && counter.requiredKeyIds[0]);
                if (heldItem && (heldItem.keyId === reqKey || (counter.requiredKeyIds && counter.requiredKeyIds.includes(heldItem.keyId)))) {
                    counter.isOpen = true;
                    const panel = counter.mesh.getObjectByName('doorPanel');
                    if (panel) panel.position.x = counter.w / 2 - 0.2;
                    playSound('unlock');
                } else {
                    playSound('process');
                }
            } else if (counter.useAction === 'quiz') {
                const reqKey = counter.requiredKeyIds;
                if (!reqKey || (heldItem && heldItem.keyId === reqKey)) {
                    openQuizModal();
                    playSound('riddle_success');
                } else {
                    playSound('process');
                }
            } else if (counter.actionType === 'config' && counter.heldItem && counter.heldItem instanceof TechItem && !counter.heldItem.isConfigured) {
                const itemType = counter.heldItem.type;
                if ((counter.type === 'config_desk' && itemType === 'laptop') || (counter.type === 'server_rack' && itemType === 'server')) {
                    counter.heldItem.isConfigured = true;
                    counter.mesh.remove(counter.heldItem.mesh);
                    counter.heldItem.mesh = counter.heldItem.createMesh();
                    counter.heldItem.mesh.position.set(0, 1.3, itemType === 'server' ? 0.4 : 0);
                    counter.mesh.add(counter.heldItem.mesh);
                    if (itemType === 'laptop') playSound('type');
                    else playSound('process');
                }
            } else if (counter.actionType === 'quiz' || counter.type === 'riddle') {
                openQuizModal();
            } else if (counter.actionType === 'deliver' && heldItem) {
                if (heldItem instanceof TechItem && heldItem.isConfigured) {
                    gameScore += 150;
                    document.getElementById('game-score').innerText = gameScore;
                    playSound('deliver');
                } else {
                    playSound('drop');
                }
                player.getObjectByName('holdingSlot').remove(heldItem.mesh);
                heldItem = null;
            }
            updateButtonStates();
        }

        function updateButtonStates() {
            const btnGrab = document.getElementById('btn-grab');
            const grabLabel = document.getElementById('grab-label');
            const grabIcon = document.getElementById('grab-icon');
            const btnAction = document.getElementById('btn-action');

            if (heldItem) {
                grabLabel.innerText = "Drop";
                grabIcon.className = "fa-solid fa-arrow-down text-2xl";
                btnGrab.classList.remove('opacity-45', 'cursor-not-allowed');
                btnGrab.disabled = false;
            } else {
                grabLabel.innerText = "Grab";
                grabIcon.className = "fa-solid fa-hand text-2xl";

                const canGrabOrDrop = currentNearbyCounter && (
                    currentNearbyCounter.allowGrab ||
                    currentNearbyCounter.type === 'key' ||
                    currentNearbyCounter.heldItem ||
                    currentNearbyCounter.actionType === 'trash'
                );

                if (canGrabOrDrop) {
                    btnGrab.classList.remove('opacity-45', 'cursor-not-allowed');
                    btnGrab.disabled = false;
                } else {
                    btnGrab.classList.add('opacity-45', 'cursor-not-allowed');
                    btnGrab.disabled = true;
                }
            }

            let canUse = false;
            if (currentNearbyCounter) {
                const c = currentNearbyCounter;
                if (c.useAction === 'open_door' || c.type === 'door') {
                    const reqKey = c.requiredKeyIds || (c.requiredKeyIds && c.requiredKeyIds[0]);
                    canUse = heldItem && (heldItem.keyId === reqKey || (c.requiredKeyIds && c.requiredKeyIds.includes(heldItem.keyId)));
                } else if (c.useAction === 'quiz') {
                    const reqKey = c.requiredKeyIds;
                    canUse = !reqKey || (heldItem && heldItem.keyId === reqKey);
                } else {
                    canUse = c.actionType === 'config' || c.actionType === 'quiz' || c.actionType === 'deliver' || c.type === 'riddle';
                }
            }

            if (canUse) {
                btnAction.classList.remove('opacity-45', 'cursor-not-allowed');
                btnAction.disabled = false;
            } else {
                btnAction.classList.add('opacity-45', 'cursor-not-allowed');
                btnAction.disabled = true;
            }
        }

        function updatePlayerMovement() {
            if (!player || !playerPhysicsBody) return;

            let dx = 0; let dz = 0;
            if (keysPressed['KeyW'] || keysPressed['ArrowUp']) dz -= 1;
            if (keysPressed['KeyS'] || keysPressed['ArrowDown']) dz += 1;
            if (keysPressed['KeyA'] || keysPressed['ArrowLeft']) dx -= 1;
            if (keysPressed['KeyD'] || keysPressed['ArrowRight']) dx += 1;

            if (joystickVector.x !== 0 || joystickVector.y !== 0) {
                dx = joystickVector.x; dz = joystickVector.y;
            }

            if (dx !== 0 || dz !== 0) {
                const len = Math.hypot(dx, dz);
                const speed = 0.12;
                physicsWorld.moveBodyWithSlide(playerPhysicsBody, (dx / len) * speed, (dz / len) * speed);
                player.rotation.y = Math.atan2(dx, dz);
            }

            updatePlayerAnimation(dx !== 0 || dz !== 0, heldItem !== null);

            let minDistance = 1.8;
            let foundCounter = null;
            kitchenCounters.forEach(c => {
                const dist = Math.hypot(player.position.x - c.x, player.position.z - c.z);
                if (dist < minDistance) { minDistance = dist; foundCounter = c; }
            });

            currentNearbyCounter = foundCounter;
            updateButtonStates();

            const hint = document.getElementById('interaction-hint');
            if (foundCounter && foundCounter.type !== 'wall') {
                hint.classList.remove('opacity-0', 'translate-y-4');
                document.getElementById('hint-text').innerText = foundCounter.label.toUpperCase();
            } else {
                hint.classList.add('opacity-0', 'translate-y-4');
            }

            currentCameraLookAt.lerp(new THREE.Vector3(player.position.x * 0.5, 0.8, player.position.z * 0.5), 0.08);
            camera.position.lerp(new THREE.Vector3(currentCameraLookAt.x + cameraOffset.x, currentCameraLookAt.y + cameraOffset.y, currentCameraLookAt.z + cameraOffset.z), 0.08);
            camera.lookAt(currentCameraLookAt);
        }

        function updateCameraWallOcclusion() {
            if (!player || !camera) return;

            const targetPos = new THREE.Vector3();
            player.getWorldPosition(targetPos);
            targetPos.y += 0.9;

            const camPos = camera.position.clone();
            const rayDir = targetPos.clone().sub(camPos);
            const distance = rayDir.length();
            rayDir.normalize();

            occlusionRaycaster.set(camPos, rayDir);
            occlusionRaycaster.far = distance - 0.2;

            const intersects = occlusionRaycaster.intersectObjects(occludableMeshes, true);
            const currentlyOccluding = new Set();

            intersects.forEach(hit => {
                let obj = hit.object;
                while (obj && !occludableMeshes.includes(obj) && obj.parent !== scene) {
                    obj = obj.parent;
                }
                if (obj) currentlyOccluding.add(obj);
            });

            occludableMeshes.forEach(groupOrMesh => {
                const isOccluding = currentlyOccluding.has(groupOrMesh);
                groupOrMesh.traverse(child => {
                    if (child.isMesh && child.material) {
                        if (child.userData.originalOpacity === undefined) {
                            child.userData.originalOpacity = child.material.opacity !== undefined ? child.material.opacity : 1.0;
                        }

                        if (isOccluding) {
                            child.material.transparent = true;
                            child.material.opacity = 0.25;
                        } else {
                            child.material.opacity = child.userData.originalOpacity;
                            if (child.material.opacity >= 0.99) child.material.transparent = false;
                        }
                    }
                });
            });
        }

        function initControls() {
            window.addEventListener('keydown', e => {
                keysPressed[e.code] = true;
                if (e.code === 'KeyE' || e.code === 'KeyZ' || e.key == 'Z' || e.key == 'z') triggerGrabDrop();
                if (e.code === 'Space' || e.key == ' ' || e.key == 'Spacebar' || e.code === 'KeyX' || e.key == 'X' || e.key == 'x') triggerAction();
                if (e.code === 'ShiftLeft' || e.key == 'Shift') triggerDash();
            });
            window.addEventListener('keyup', e => keysPressed[e.code] = false);

            document.getElementById('btn-grab').addEventListener('touchstart', (e) => { e.preventDefault(); triggerGrabDrop(); });
            document.getElementById('btn-action').addEventListener('touchstart', (e) => { e.preventDefault(); triggerAction(); });
            document.getElementById('btn-dash').addEventListener('touchstart', (e) => { e.preventDefault(); triggerDash(); });
            document.getElementById('btn-quiz').addEventListener('touchstart', (e) => { e.preventDefault(); openQuizModal(); });

            document.getElementById('btn-grab').addEventListener('click', triggerGrabDrop);
            document.getElementById('btn-action').addEventListener('click', triggerAction);
            document.getElementById('btn-dash').addEventListener('click', triggerDash);
            document.getElementById('btn-quiz').addEventListener('click', openQuizModal);

            const joyContainer = document.getElementById('joystick-container');
            const joyKnob = document.getElementById('joystick-knob');
            let isDragging = false;

            const handleTouch = (clientX, clientY) => {
                const rect = joyContainer.getBoundingClientRect();
                let dx = clientX - (rect.left + rect.width / 2);
                let dy = clientY - (rect.top + rect.height / 2);
                const dist = Math.hypot(dx, dy);
                const max = rect.width / 2 - 20;
                if (dist > max) { dx = (dx / dist) * max; dy = (dy / dist) * max; }
                joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickVector = { x: dx / max, y: dy / max };
            };

            joyContainer.addEventListener('pointerdown', e => { isDragging = true; handleTouch(e.clientX, e.clientY); });
            window.addEventListener('pointermove', e => { if (isDragging) handleTouch(e.clientX, e.clientY); });
            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    joyKnob.style.transform = `translate(0px, 0px)`;
                    joystickVector = { x: 0, y: 0 };
                }
            });
        }

        function openQuizModal() {
            if (assetRepository.quizzes.length === 0) return;
            activeQuizIndex = Math.floor(Math.random() * assetRepository.quizzes.length);
            const quiz = assetRepository.quizzes[activeQuizIndex];
            document.getElementById('quiz-question').innerText = `"${quiz.q}"`;
            const opts = document.getElementById('quiz-options');
            opts.innerHTML = '';
            quiz.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-slate-800 hover:bg-blue-600 text-slate-200 hover:text-white font-bold p-3 rounded-xl border border-slate-700 text-xs transition text-left flex justify-between items-center";
                btn.onclick = () => {
                    if (i === quiz.correct) {
                        gameScore += 100;
                        document.getElementById('game-score').innerText = gameScore;
                        playSound('riddle_success');
                    }
                    closeQuizModal();
                };
                btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-check opacity-50"></i>`;
                opts.appendChild(btn);
            });
            document.getElementById('quiz-modal').classList.remove('hidden');
        }
        function closeQuizModal() { document.getElementById('quiz-modal').classList.add('hidden'); }

        let selectedMapObjectIndex = -1;
        let isDraggingMapObject = false;

        function worldToCanvasCoords(wx, wz, canvas) {
            const scaleX = (canvas.width - 60) / 20;
            const scaleZ = (canvas.height - 60) / 16;
            return { x: canvas.width / 2 + wx * scaleX, y: canvas.height / 2 + wz * scaleZ };
        }

        function canvasToWorldCoords(cx, cy, canvas) {
            const scaleX = (canvas.width - 60) / 20;
            const scaleZ = (canvas.height - 60) / 16;
            return { x: (cx - canvas.width / 2) / scaleX, z: (cy - canvas.height / 2) / scaleZ };
        }




        function applyEditorChangesToKitchen() {
            physicsWorld = new KitchenPhysicsWorld();
            buildFloorplan();
            document.getElementById('editor-modal').classList.add('hidden');
            playSound('deliver');
        }


        function animate() {
            requestAnimationFrame(animate);
            updatePlayerMovement();
            updateCameraWallOcclusion();
            scene.traverse(child => { if (child.userData && child.userData.canRotate) child.rotation.y += 0.02; });
            renderer.render(scene, camera);
        }

        window.onload = () => {
            init3DScene();
            buildFloorplan();
            initPlayers();
            initControls();
            renderOrdersList();

            setInterval(() => {
                if (gameTimerSeconds > 0) {
                    gameTimerSeconds--;
                    const m = Math.floor(gameTimerSeconds / 60).toString().padStart(2, '0');
                    const s = (gameTimerSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('game-timer').innerText = `${m}:${s}`;
                }
            }, 1000);

            animate();
        };
    </script>
</body>
