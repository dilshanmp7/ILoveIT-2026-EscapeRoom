        body {

            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            overflow: hidden;
            background-color: #111827;

        .font-game {
            font-family: 'Fredoka One', cursive;

        /* Custom Scrollbar - DHL Yellow & Red */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffcc00;
            border-radius: 4px;
        }

        /* Virtual Joystick Styling */
        #joystick-container {
            touch-action: none;
        }

        /* Animations */
        @keyframes float-gentle {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .animate-float {
            animation: float-gentle 2.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            }

            50% {
                box-shadow: 0 0 30px rgba(255, 204, 0, 0.9);
            }
        }

        .animate-glow {
            animation: pulse-glow 2s infinite;
        }

        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #map-editor-canvas {
            cursor: crosshair;
            background-color: #0f172a;
        }

        /* ========================================================================

        /* ========================================================================

        /* ========================================================================
           2. PHYSICS ENGINE & TECH ITEMS
           ======================================================================== */
        class PhysicalBody {
            constructor(params) {
                this.x = params.x || 0; this.y = params.y || 0; this.z = params.z || 0;
                this.width = params.width || 1; this.depth = params.depth || 1;
                this.isStatic = params.isStatic || false; this.mesh = params.mesh || null;
            }
            getAABB() {
                return { minX: this.x - this.width / 2, maxX: this.x + this.width / 2, minZ: this.z - this.depth / 2, maxZ: this.z + this.depth / 2 };
            }
        }

        class KitchenPhysicsWorld {
            constructor() { this.bodies = []; }
            addBody(body) { this.bodies.push(body); return body; }
            checkAABBCollision(a, b) {
                const boxA = a.getAABB(); const boxB = b.getAABB();
                return (boxA.minX < boxB.maxX && boxA.maxX > boxB.minX && boxA.minZ < boxB.maxZ && boxA.maxZ > boxB.minZ);
            }
            moveBodyWithSlide(body, deltaX, deltaZ) {
                if (body.isStatic) return;
                body.x += deltaX;
                for (let other of this.bodies) {
                    if (other !== body && this.checkAABBCollision(body, other)) {
                        if (deltaX > 0) body.x = other.x - other.width / 2 - body.width / 2 - 0.001;
                        else if (deltaX < 0) body.x = other.x + other.width / 2 + body.width / 2 + 0.001;
                    }
                }
                body.z += deltaZ;
                for (let other of this.bodies) {
                    if (other !== body && this.checkAABBCollision(body, other)) {
                        if (deltaZ > 0) body.z = other.z - other.depth / 2 - body.depth / 2 - 0.001;
                        else if (deltaZ < 0) body.z = other.z + other.depth / 2 + body.depth / 2 + 0.001;
                    }
                }
                if (body.mesh) { body.mesh.position.x = body.x; body.mesh.position.z = body.z; }
            }
        }
        let physicsWorld = new KitchenPhysicsWorld();

        class TechItem {
            constructor(type) {
                this.type = type; // 'laptop' or 'server'
                this.isConfigured = false;
                this.mesh = this.createMesh();
            }
            createMesh() {
                const group = new THREE.Group();
                if (this.type === 'laptop') {
                    const mat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.8 });
                    const base = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.3), mat);
                    group.add(base);

                    if (this.isConfigured) {
                        const screenMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
                        const screen = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.02), screenMat);
                        screen.position.set(0, 0.15, -0.14);
                        screen.rotation.x = -Math.PI / 12;
                        group.add(screen);

                        const displayMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
                        const display = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.25), displayMat);
                        display.position.set(0, 0.15, -0.125);
                        display.rotation.x = -Math.PI / 12;
                        group.add(display);
                    } else {
                        const lid = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.3), mat);
                        lid.position.y = 0.04;
                        group.add(lid);
                    }
                } else if (this.type === 'server') {
                    const mat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5 });
                    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.5), mat);
                    group.add(blade);

                    const lightMat = new THREE.MeshBasicMaterial({ color: this.isConfigured ? 0x22c55e : 0xef4444 });
                    const light = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.02), lightMat);
                    light.position.set(-0.1, 0, 0.26);
                    group.add(light);
                }
                return group;
            }
        }






        let selectedMapObjectIndex = -1;
        let isDraggingMapObject = false;

        function worldToCanvasCoords(wx, wz, canvas) {
            const scaleX = (canvas.width - 60) / 20;
            const scaleZ = (canvas.height - 60) / 16;
            return { x: canvas.width / 2 + wx * scaleX, y: canvas.height / 2 + wz * scaleZ };
        }

        function canvasToWorldCoords(cx, cy, canvas) {
            const scaleX = (canvas.width - 60) / 20;
            const scaleZ = (canvas.height - 60) / 16;
            return { x: (cx - canvas.width / 2) / scaleX, z: (cy - canvas.height / 2) / scaleZ };
        }

        function draw2DMapCanvas() {
            const canvas = document.getElementById('map-editor-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const layout = assetRepository.mapLayout;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1;
            for (let x = -10; x <= 10; x += 2) {
                const pt1 = worldToCanvasCoords(x, -8, canvas);
                const pt2 = worldToCanvasCoords(x, 8, canvas);
                ctx.beginPath(); ctx.moveTo(pt1.x, pt1.y); ctx.lineTo(pt2.x, pt2.y); ctx.stroke();
            }
            for (let z = -8; z <= 8; z += 2) {
                const pt1 = worldToCanvasCoords(-10, z, canvas);
                const pt2 = worldToCanvasCoords(10, z, canvas);
                ctx.beginPath(); ctx.moveTo(pt1.x, pt1.y); ctx.lineTo(pt2.x, pt2.y); ctx.stroke();
            }

            const tl = worldToCanvasCoords(-8.5, -6.5, canvas);
            const br = worldToCanvasCoords(8.5, 6.5, canvas);
            ctx.strokeStyle = "#ffcc00"; ctx.setLineDash([4, 4]);
            ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
            ctx.setLineDash([]);

            layout.forEach((obj, idx) => {
                const pos = worldToCanvasCoords(obj.x, obj.z, canvas);
                const isSelected = (idx === selectedMapObjectIndex);
                const boxW = Math.max(20, (obj.w / 20) * (canvas.width - 60));
                const boxH = Math.max(20, (obj.d / 16) * (canvas.height - 60));

                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.rotate(THREE.MathUtils.degToRad(obj.rotation || 0));

                ctx.fillStyle = "#3b82f6";
                if (obj.type.startsWith('box_')) ctx.fillStyle = "#ffcc00";
                if (obj.type === 'delivery') ctx.fillStyle = "#d40511";
                if (obj.type === 'wall') ctx.fillStyle = "#64748b";
                if (obj.type === 'riddle') ctx.fillStyle = "#7e22ce";

                ctx.fillRect(-boxW / 2, -boxH / 2, boxW, boxH);

                ctx.lineWidth = isSelected ? 3 : 1;
                ctx.strokeStyle = isSelected ? "#ffffff" : "#000000";
                ctx.strokeRect(-boxW / 2, -boxH / 2, boxW, boxH);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 9px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(obj.label ? obj.label.substring(0, 10) : obj.type, 0, 0);

                ctx.strokeStyle = "#ffffff";
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, boxH / 2 + 4);
                ctx.stroke();
                ctx.restore();
            });
        }

        function setup2DMapCanvasEvents() {
            const canvas = document.getElementById('map-editor-canvas');
            if (!canvas) return;

            const resizeCanvas = () => {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width; canvas.height = rect.height;
                draw2DMapCanvas();
            };
            resizeCanvas(); window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;
                const layout = assetRepository.mapLayout;
                let foundIndex = -1;

                for (let i = layout.length - 1; i >= 0; i--) {
                    const obj = layout[i];
                    const pos = worldToCanvasCoords(obj.x, obj.z, canvas);
                    const boxW = Math.max(20, (obj.w / 20) * (canvas.width - 60));
                    const boxH = Math.max(20, (obj.d / 16) * (canvas.height - 60));

                    if (Math.abs(mouseX - pos.x) < boxW / 2 && Math.abs(mouseY - pos.y) < boxH / 2) {
                        foundIndex = i; break;
                    }
                }
                selectedMapObjectIndex = foundIndex;
                isDraggingMapObject = (foundIndex !== -1);
                renderInspectorPanel(); draw2DMapCanvas();
            });

            canvas.addEventListener('mousemove', (e) => {
                if (isDraggingMapObject && selectedMapObjectIndex !== -1) {
                    const rect = canvas.getBoundingClientRect();
                    const worldPos = canvasToWorldCoords(e.clientX - rect.left, e.clientY - rect.top, canvas);
                    assetRepository.mapLayout[selectedMapObjectIndex].x = Math.round(worldPos.x * 2) / 2;
                    assetRepository.mapLayout[selectedMapObjectIndex].z = Math.round(worldPos.z * 2) / 2;
                    renderInspectorPanel(); draw2DMapCanvas();
                }
            });
            window.addEventListener('mouseup', () => isDraggingMapObject = false);
        }

        function renderInspectorPanel() {
            const container = document.getElementById('inspector-content');
            if (selectedMapObjectIndex === -1 || !assetRepository.mapLayout[selectedMapObjectIndex]) {
                container.innerHTML = `<div class="text-slate-400 text-center py-4 text-[11px]">Click an object on the 2D grid.</div>`;
                return;
            }
            const obj = assetRepository.mapLayout[selectedMapObjectIndex];
            container.innerHTML = `
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Label</label>
                    <input type="text" value="${obj.label}" onchange="updateSelectedObjectProp('label', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                </div>
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <div>
                        <label class="block text-[10px] text-slate-400 font-bold mb-1">X Position</label>
                        <input type="number" step="0.5" value="${obj.x}" onchange="updateSelectedObjectProp('x', parseFloat(this.value))" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 font-bold mb-1">Z Position</label>
                        <input type="number" step="0.5" value="${obj.z}" onchange="updateSelectedObjectProp('z', parseFloat(this.value))" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                    </div>
                </div>
                <div class="mt-2">
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Rotation</label>
                    <input type="number" step="15" value="${obj.rotation || 0}" onchange="updateSelectedObjectProp('rotation', parseFloat(this.value))" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                </div>

                <div class="mt-3 pt-2 border-t border-slate-800 space-y-2">
                    <div class="text-[10px] font-bold text-yellow-400 uppercase">Asset Use & Action Rules</div>
                    
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] text-slate-300">Allow Grab (Pickup)</span>
                        <input type="checkbox" ${obj.allowGrab ? 'checked' : ''} onchange="updateSelectedObjectProp('allowGrab', this.checked)" class="accent-yellow-400">
                    </div>

                    <div>
                        <label class="block text-[10px] text-slate-400 font-bold mb-1">Action Type (Surface)</label>
                        <select onchange="updateSelectedObjectProp('actionType', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                            <option value="none" ${obj.actionType === 'none' ? 'selected' : ''}>None (Storage / Surface)</option>
                            <option value="config" ${obj.actionType === 'config' ? 'selected' : ''}>Configure / Process Device</option>
                            <option value="quiz" ${obj.actionType === 'quiz' ? 'selected' : ''}>Open Security Quiz</option>
                            <option value="deliver" ${obj.actionType === 'deliver' ? 'selected' : ''}>IT Dispatch Hatch (Score)</option>
                            <option value="trash" ${obj.actionType === 'trash' ? 'selected' : ''}>Trash Bin (Discard)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] text-slate-400 font-bold mb-1">Use Action Behavior</label>
                        <select onchange="updateSelectedObjectProp('useAction', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                            <option value="none" ${obj.useAction === 'none' ? 'selected' : ''}>None</option>
                            <option value="open_door" ${obj.useAction === 'open_door' ? 'selected' : ''}>Slide Open Door (Requires Key)</option>
                            <option value="quiz" ${obj.useAction === 'quiz' ? 'selected' : ''}>Trigger Quiz (Requires Badge)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] text-slate-400 font-bold mb-1">Required Held Key ID for Use</label>
                        <input type="text" value="${obj.requiredKeyIds || ''}" placeholder="e.g. SLIDING_DOR_KEY" onchange="updateSelectedObjectProp('requiredKeyIds', this.value.toUpperCase())" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                    </div>

                    <div>
                        <label class="block text-[10px] text-slate-400 font-bold mb-1">Accepts Drop Item Type</label>
                        <input type="text" value="${obj.acceptsDrop || ''}" placeholder="e.g. laptop, server, configured, any" onchange="updateSelectedObjectProp('acceptsDrop', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                    </div>

                    ${obj.type === 'key' ? `
                    <div>
                        <label class="block text-[10px] text-slate-400 font-bold mb-1">Key ID</label>
                        <input type="text" value="${obj.keyId || 'ADMIN_KEY'}" onchange="updateSelectedObjectProp('keyId', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                    </div>
                    ` : ''}
                </div>

                <button onclick="deleteSelectedObject()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-1.5 rounded-xl text-xs mt-3 transition">Delete Object</button>
            `;
        }

        function addPresetAsset(type) {
            const labels = {
                box_laptop: 'Laptops Box', box_server: 'Servers Box', config_desk: 'Config Station',
                server_rack: 'Server Rack', riddle: 'Security Terminal', delivery: 'IT Dispatch Hatch',
                wall: 'Partition Wall', office_desk: 'Worker Desk', trash: 'Recycle Bin',
                door: 'Secure Door', key: 'ID Badge'
            };
            const w = (type === 'wall' || type === 'door') ? 2.5 : (type === 'delivery' ? 2.5 : 1.5);
            const d = (type === 'wall' || type === 'door') ? 0.4 : (type === 'delivery' ? 1.5 : 1.2);
            const newObj = {
                id: 'obj_' + Date.now(),
                x: 0, z: 0, rotation: 0, w: w, d: d,
                color: type === 'door' ? 0x3b82f6 : (type === 'key' ? 0x0ea5e9 : 0x1e293b),
                type: type, label: labels[type] || type,
                keyId: type === 'key' ? 'ADMIN_KEY' : undefined,
                useAction: type === 'door' ? 'open_door' : 'none',
                requiredKeyIds: type === 'door' ? ['ADMIN_KEY', 'SLIDING_DOR_KEY'] : undefined,
                isOpen: false,
                allowGrab: type === 'key' || type.startsWith('box_'),
                actionType: 'none',
                acceptsDrop: ''
            };
            assetRepository.mapLayout.push(newObj);
            selectedMapObjectIndex = assetRepository.mapLayout.length - 1;
            renderInspectorPanel(); draw2DMapCanvas();
        }

        function updateSelectedObjectProp(prop, val) {
            if (selectedMapObjectIndex !== -1) {
                assetRepository.mapLayout[selectedMapObjectIndex][prop] = val;
                renderInspectorPanel(); draw2DMapCanvas();
            }
        }

        function deleteSelectedObject() {
            if (selectedMapObjectIndex !== -1) {
                assetRepository.mapLayout.splice(selectedMapObjectIndex, 1);
                selectedMapObjectIndex = -1;
                renderInspectorPanel(); draw2DMapCanvas();
            }
        }
        /* Security Check Editor Tab */
        function renderEditorQuizzesList() {
            const container = document.getElementById('editor-quizzes-list');
            container.innerHTML = '';
            assetRepository.quizzes.forEach((quiz, idx) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 p-3 rounded-2xl flex justify-between items-center group hover:border-blue-500/50 transition cursor-pointer";
                card.onclick = () => loadQuizIntoForm(idx);
                card.innerHTML = `
                    <div class="flex-1 pr-2">
                        <div class="font-bold text-xs text-blue-300 line-clamp-1">"${quiz.q}"</div>
                        <div class="text-[10px] text-slate-400 mt-1">Answer: <span class="text-emerald-400 font-bold">${quiz.options[quiz.correct]}</span></div>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="event.stopPropagation(); deleteQuizItem(${idx})" class="w-6 h-6 bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white rounded-lg flex items-center justify-center text-xs transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function initNewQuizForm() {
            document.getElementById('quiz-form-index').value = "-1";
            document.getElementById('quiz-form-q').value = "";
            document.getElementById('quiz-form-opt-0').value = "";
            document.getElementById('quiz-form-opt-1').value = "";
            document.getElementById('quiz-form-opt-2').value = "";
            document.getElementById('quiz-form-opt-3').value = "";
            document.getElementById('radio-opt-0').checked = true;
        }

        function loadQuizIntoForm(idx) {
            const quiz = assetRepository.quizzes[idx];
            if (!quiz) return;
            document.getElementById('quiz-form-index').value = idx;
            document.getElementById('quiz-form-q').value = quiz.q;
            document.getElementById('quiz-form-opt-0').value = quiz.options[0] || "";
            document.getElementById('quiz-form-opt-1').value = quiz.options[1] || "";
            document.getElementById('quiz-form-opt-2').value = quiz.options[2] || "";
            document.getElementById('quiz-form-opt-3').value = quiz.options[3] || "";
            document.getElementById(`radio-opt-${quiz.correct}`).checked = true;
        }

        function saveQuizForm(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('quiz-form-index').value, 10);
            const q = document.getElementById('quiz-form-q').value;
            const options = [
                document.getElementById('quiz-form-opt-0').value,
                document.getElementById('quiz-form-opt-1').value,
                document.getElementById('quiz-form-opt-2').value,
                document.getElementById('quiz-form-opt-3').value
            ];
            const correctRadio = document.querySelector('input[name="correct_option"]:checked');
            const correct = parseInt(correctRadio ? correctRadio.value : "0", 10);

            if (idx === -1) {
                assetRepository.quizzes.push({ q: q, options: options, correct: correct });
            } else {
                assetRepository.quizzes[idx] = { q: q, options: options, correct: correct };
            }

            renderEditorQuizzesList();
            initNewQuizForm();
            playSound('riddle_success');
        }

        function deleteQuizItem(index) {
            assetRepository.quizzes.splice(index, 1);
            renderEditorQuizzesList();
            initNewQuizForm();
        }

        function toggleEditorModal() {
            const modal = document.getElementById('editor-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                setup2DMapCanvasEvents();
                draw2DMapCanvas();
                renderEditorQuizzesList();
            }
        }

        function switchEditorTab(t) {
            document.getElementById('tab-content-map').classList.add('hidden');
            document.getElementById('tab-content-quiz').classList.add('hidden');
            document.getElementById('tab-btn-map').className = "flex-1 py-2 rounded-xl font-game text-xs text-slate-400 hover:text-white transition";
            document.getElementById('tab-btn-quiz').className = "flex-1 py-2 rounded-xl font-game text-xs text-slate-400 hover:text-white transition";

            document.getElementById('tab-content-' + t).classList.remove('hidden');
            if (t === 'map') {
                document.getElementById('tab-btn-map').className = "flex-1 py-2 rounded-xl font-game text-xs bg-red-700 text-yellow-300 shadow-md transition";
                draw2DMapCanvas();
            } else {
                document.getElementById('tab-btn-quiz').className = "flex-1 py-2 rounded-xl font-game text-xs bg-red-700 text-yellow-300 shadow-md transition";
                renderEditorQuizzesList();
            }
        }

        function applyEditorChangesToKitchen() {
            physicsWorld = new KitchenPhysicsWorld();
            buildFloorplan();
            document.getElementById('editor-modal').classList.add('hidden');
            playSound('deliver');
        }




        window.onload = () => {



        };
    </script>
